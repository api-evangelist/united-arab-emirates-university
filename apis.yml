  reason: no_public_api
  detail: >-
    UAEU operates no public API program — no developer portal, no API key
    self-service, no UAEU-authored OpenAPI, and no agent surface. What machine
    readability exists falls into two buckets, neither of which is an API
    product. First, three standards-mandated discovery documents on the
    university's own identity service (eisprod.uaeu.ac.ae): OIDC discovery,
    SAML 2.0 IdP metadata and a SCIM 2.0 ServiceProviderConfig, all 200
    unauthenticated. These are saved as artifacts and are the only
    institution-operated machine-readable surface found. Second, a stack of
    vendor tenancies — bepress Digital Commons, Elsevier Pure, Blackboard, OCLC
    WorldCat, Springshare LibGuides, Ellucian Banner, and an organization
    account on the UAE federal open data portal. The Pure deployment publishes a
    complete Elsevier OpenAPI without authentication; it was found, read and
    deliberately not saved, because the contract is Elsevier's. Every agent and
    API well-known path on www.uaeu.ac.ae (llms.txt, ai.txt, apis.json,
    openapi.json, .well-known/agent.json, .well-known/mcp.json,
    .well-known/ai-plugin.json, .well-known/security.txt) returns HTTP 200 with
    the site's ~112KB HTML 404 page — soft-404s, credited to nothing.
