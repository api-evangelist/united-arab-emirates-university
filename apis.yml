  - aid: united-arab-emirates-university:scholarworks-oai-pmh
    name: Scholarworks@UAEU OAI-PMH Repository Endpoint
    x-operator: tenant
    description: >-
      OAI-PMH 2.0 metadata harvesting endpoint for Scholarworks@UAEU, the
      university's open-access institutional repository. Verified live returning
      valid OAI-PMH XML with repositoryName "Scholarworks@UAEU",
      repositoryIdentifier scholarworks.uaeu.ac.ae, earliestDatestamp
      2000-01-19, and five metadata prefixes. TENANT, NOT INSTITUTION:
      scholarworks.uaeu.ac.ae is a CNAME to dcuaeu.bepress.com and the Identify
      response reports adminEmail dc-support@elsevier.com. The repository, its
      content, its sets and its DataCite DOIs are UAEU's; the OAI-PMH
      implementation is bepress Digital Commons, an Elsevier product. No bepress
      contract is saved under this institution.
    humanURL: https://scholarworks.uaeu.ac.ae/
