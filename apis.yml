description: >-
  United Arab Emirates University (UAEU) is the UAE's national public research
  university, founded 1976 in Al Ain, Abu Dhabi. Its machine-readable footprint
  is small, and almost all of what appears under its name is a vendor's contract
  running on a UAEU-branded host. Exactly one surface is institution-operated:
  the UAEU enterprise identity service at eisprod.uaeu.ac.ae, a WSO2 Identity
  Server deployment on the university's own domain and certificate, which serves
  unauthenticated OpenID Connect discovery, SAML 2.0 IdP metadata and a SCIM 2.0
  ServiceProviderConfig. Everything else is a tenancy. Scholarworks@UAEU
  (scholarworks.uaeu.ac.ae) answers OAI-PMH 2.0 but CNAMEs to dcuaeu.bepress.com
  and reports adminEmail dc-support@elsevier.com — bepress Digital Commons.
  research.uaeu.ac.ae CNAMEs to uaeu.elsevierpure.com and serves a complete
  827-path Elsevier "Pure API" OpenAPI at /ws/api/openapi.json; that contract is
  Elsevier's and is deliberately NOT saved in this repository. The LMS is a
  Blackboard tenant, library discovery is OCLC WorldCat, and UAEU's open data is
  published as an organization account on the UAE federal portal rather than on
  its own infrastructure. UAEU does hold its own DataCite provider account
  (MIWJ) and Crossref membership (prefix 10.36771). There is no public developer
  portal, no self-service API program, no UAEU-authored OpenAPI, and no agent
  surface — every well-known path probed returns the site's soft-404 page.
