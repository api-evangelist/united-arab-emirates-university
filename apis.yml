  - aid: united-arab-emirates-university:pure-research-portal
    name: UAEU Research Portal (Elsevier Pure) — tenant deployment
    x-operator: tenant
    description: >-
      UAEU's research information system and public research portal, at
      research.uaeu.ac.ae, which CNAMEs to uaeu.elsevierpure.com. The deployment
      serves a complete OpenAPI 3.0.1 document at /ws/api/openapi.json without
      authentication — 827 paths, info.title "Pure API", version 5.36.2-1,
      info.contact.email pure-support@elsevier.com, and servers[] of "/ws/api"
      (relative, so a host-based ownership check is blind to it — the exact
      hostless class that caused Manchester's 36 Pure specs to be misattributed).
      THE CONTRACT IS ELSEVIER'S AND IS NOT SAVED IN THIS REPOSITORY. What is
      recorded here is the relationship: UAEU is a Pure customer whose research
      data is exposed through Elsevier's contract. All data endpoints return 401
      without an api-key header.
    humanURL: https://research.uaeu.ac.ae/
    baseURL: https://research.uaeu.ac.ae/ws/api
    tags: [ Research Information, CRIS, Elsevier Pure, Research Repository ]
    x-vendor: Elsevier Pure
    x-vendor-evidence: 'CNAME uaeu.elsevierpure.com; info.title "Pure API"; info.contact.email pure-support@elsevier.com; servers[] "/ws/api"'
    x-do-not-save: >-
      The OpenAPI at research.uaeu.ac.ae/ws/api/openapi.json is Elsevier's
      product contract. Saving it under this institution is the exact
      misattribution the university pipeline exists to prevent.
    properties:
      - type: Documentation
        url: https://research.uaeu.ac.ae/
  - aid: united-arab-emirates-university:fcsc-open-data
    name: UAEU Open Data on the UAE Federal Open Data Portal (CKAN)
    x-operator: tenant
    description: >-
      UAEU publishes open datasets as an organization account on the UAE federal
      open data portal operated by the Federal Competitiveness and Statistics
      Centre, built on CKAN. The operator is the UAE federal government, not the
      university; UAEU holds an account on it. Every programmatic probe of the
      CKAN Action API returns HTTP 403 behind Cloudflare bot mitigation, with a
      browser User-Agent as well as without, so the endpoint is bot-blocked
      rather than dead. UAEU's own open data pages link to the national
      bayanat.ae portal, which is reachable. UAEU operates no CKAN, Socrata or
      other open data portal of its own.
    humanURL: https://www.uaeu.ac.ae/en/open-data/
    baseURL: https://opendata.fcsc.gov.ae/api/3/action/
    tags: [ Open Data, CKAN, Datasets, Government, Research ]
