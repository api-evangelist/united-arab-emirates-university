apis:
  - aid: united-arab-emirates-university:uaeu-identity-service
    name: UAEU Enterprise Identity Service (OIDC / SAML 2.0 / SCIM 2.0)
    x-operator: institution
    description: >-
      The university's own single sign-on service, running on UAEU's registrable
      domain under a certificate issued to *.uaeu.ac.ae. It is the login point
      for UAEU applications — Banner Self-Service at ssb.uaeu.ac.ae redirects
      into it — and it publishes three unauthenticated discovery documents:
      OpenID Connect configuration (issuer eisprod.uaeu.ac.ae:9443), SAML 2.0
      IdP metadata (entityID eisprod.uaeu.ac.ae) and a SCIM 2.0
      ServiceProviderConfig declaring patch, filter and bulk support. Ten OAuth
      scopes and twenty-nine OIDC claims are advertised. All operational
      endpoints require a registered client; dynamic client registration is
      advertised but has no public onboarding path. This is institutional
      plumbing, not an API product, and it is recorded as such.
    humanURL: https://www.uaeu.ac.ae/en/vc/doit/
    baseURL: https://eisprod.uaeu.ac.ae/
    tags: [ Identity, Single Sign-On, OpenID Connect, SAML, SCIM, Authentication ]
